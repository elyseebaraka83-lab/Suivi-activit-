<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi des activités</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1b1f24;--m:#6b7280;--p:#1d4ed8;--g:#15803d;--r:#b91c1c;--b:#e2e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111418;--c:#1b2026;--t:#e8eaed;--m:#9aa3ad;--p:#6b9bff;--g:#4ade80;--r:#f87171;--b:#2b323a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
header{padding:14px 14px 6px;font-weight:700;font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 14px}
nav button{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);padding:8px 14px;border-radius:20px;font-size:14px}
nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
main{padding:8px 14px 40px;max-width:720px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
.stats{display:flex;gap:8px}.stats div{flex:1;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center}
.stats small{display:block;color:var(--m);font-size:12px}.stats b{font-size:15px}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:15px}
button{font:inherit;cursor:pointer}
.add{width:100%;padding:11px;margin-top:6px;border:0;border-radius:8px;background:var(--p);color:#fff;font-weight:600}
.r{display:flex;gap:6px;margin-top:8px}.r input{margin:0}.r button{border:0;border-radius:8px;background:var(--g);color:#fff;padding:0 12px}
.r button.x,.x{background:none!important;color:var(--r)!important;font-size:20px;border:0}
.m{color:var(--m);font-size:13px}.neg{color:var(--r)}.pos{color:var(--g)}
.tag{background:var(--r);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}td,th{padding:5px 3px;border-bottom:1px solid var(--b);text-align:right}td:first-child,th:first-child{text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;padding:10px 4px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}.seg button.on{background:var(--p);color:#fff;border-color:var(--p)}
</style></head><body>
<header>📒 Suivi des activités</header><nav id="nav"></nav><main id="main"></main>
<script>
let S;try{S=JSON.parse(localStorage.getItem('suivi'))}catch(e){}
S=S||{};['caisse','commerce','reseaux','moulin','dettes','prets'].forEach(k=>S[k]=S[k]||[]);
const save=()=>{try{localStorage.setItem('suivi',JSON.stringify(S))}catch(e){}};
const f=n=>(Math.round(+n||0)).toLocaleString('fr-FR')+' F';
const td=()=>new Date().toISOString().slice(0,10);
const sum=a=>a.reduce((s,x)=>s+x.m,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>$(id).value.trim();
let tab='caisse';
const TABS={caisse:'Caisse',commerce:'Commerce',reseaux:'Réseaux',moulin:'Moulin',dettes:'Dettes',prets:'Prêts',histo:'Historique'};
const stats=a=>'<div class="stats">'+a.map(([l,v,c])=>`<div><small>${l}</small><b class="${c||''}">${f(v)}</b></div>`).join('')+'</div>';
function del(k,i){if(confirm('Supprimer ?')){S[k].splice(i,1);save();render()}}
function add(k,o){if(!(o.m>0)){alert('Montant invalide');return}S[k].push(o);save();render()}
const RES={orange:'Orange Money',airtel:'Airtel Money',vodafone:'Vodafone'};
const OPS={dep:['Dépôt client',-1],ret:['Retrait client',1],env:['Envoi',-1],app:['Approvisionnement / solde',1]};
let cs='acc',un='orange',hs='all',hf='',ht='';
const UN={orange:'Orange',airtel:'Airtel',africell:'Africell',vodacom:'Vodacom'};
const RB={caisse:'Caisse',commerce:'Commerce',reseaux:'Réseaux',moulin:'Moulin',dettes:'Dettes',prets:'Prêts'};
function evts(){const E=[],p=(s,d,l,m,g)=>E.push({s,d,l,m,g});
S.caisse.forEach(x=>p('caisse',x.d,x.l||'Caisse',x.m,x.t=='in'?1:-1));
S.commerce.forEach(x=>p('commerce',x.d,(x.t=='achat'?'Achat ':'Vente ')+x.p+' × '+x.q,x.q*x.u,x.t=='achat'?-1:1));
S.reseaux.forEach(x=>p('reseaux',x.d,OPS[x.o][0]+' '+RES[x.n],x.m,-OPS[x.o][1]));
S.moulin.forEach(x=>{p('moulin',x.d,'Recharge '+x.l+' (attendu '+f(x.m)+')',x.m,0);x.p.forEach(y=>p('moulin',y.d,'Encaissé · '+x.l,y.m,1))});
S.dettes.forEach(x=>{p('dettes',x.d,'Dette '+x.l+(x.o?' · '+x.o:''),x.m,0);x.p.forEach(y=>p('dettes',y.d,'Remboursé · '+x.l,y.m,1))});
S.prets.forEach(x=>{p('prets',x.d,'Prêt à '+x.n,x.m,-1);sch(x).forEach((e,j)=>{if(x.pd&&x.pd[j])p('prets',e.dt,'Échéance payée · '+x.n,e.t,1)})});
return E.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0)}
const V={
caisse(){const L=[...S.caisse.map((x,i)=>({...x,i,o:0})),...S.commerce.map(x=>({t:x.t=='achat'?'out':'in',l:(x.t=='achat'?'Achat ':'Vente ')+x.p+' · auto',m:x.q*x.u,d:x.d,a:'Commerce',o:1})),...S.reseaux.map(x=>({t:OPS[x.o][1]>0?'out':'in',l:OPS[x.o][0]+' '+RES[x.n]+' · auto',m:x.m,d:x.d,a:'Réseaux',o:2}))].sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:p.o-q.o);
const e=sum(L.filter(x=>x.t=='in')),s=sum(L.filter(x=>x.t=='out'));
return stats([['Entrées',e,'pos'],['Sorties',s,'neg'],['Solde',e-s]])+
`<div class="m" style="margin:8px 2px">Les lignes « auto » viennent des onglets Commerce et Réseaux.</div><div class="card"><select id="a"><option value="in">Entrée d'argent</option><option value="out">Sortie d'argent</option></select><input id="b" placeholder="Libellé"><input id="c" type="number" inputmode="decimal" placeholder="Montant"><input id="d" type="date" value="${td()}"><button class="add" onclick="add('caisse',{t:val('a'),l:val('b'),m:+val('c'),d:val('d')})">Ajouter</button></div>`+
L.map((x,i)=>`<div class="card row"><div><b>${esc(x.l||'—')}</b><div class="m">${x.d}</div></div><div class="${x.t=='in'?'pos':'neg'}">${x.t=='in'?'+':'−'}${f(x.m)}<button class="x" onclick="${x.a?`alert('Automatique : à modifier dans l\'onglet ${x.a}')`:`del('caisse',${x.i})`}">×</button></div></div>`).reverse().join('')},
commerce(){return `<div class="seg"><button class="${cs=='acc'?'on':''}" onclick="cs='acc';render()">Accessoires</button><button class="${cs=='uni'?'on':''}" onclick="cs='uni';render()">Unités</button></div>`+(cs=='uni'?V.uni():V.acc())},
uni(){const C=S.commerce.map((x,i)=>({...x,i})).filter(x=>x.r),st=k=>C.filter(x=>x.r==k).reduce((s,x)=>s+(x.t=='achat'?x.q:-x.q),0),L=C.filter(x=>x.r==un),tot=t=>L.filter(x=>x.t==t).reduce((s,x)=>s+x.q*x.u,0);
return `<div class="seg">${Object.keys(UN).map(k=>`<button class="${k==un?'on':''}" onclick="un='${k}';render()">${UN[k]}<br><small>${st(k)}</small></button>`).join('')}</div>`+
`<div class="card row"><b>Stock ${UN[un]}</b><b class="${st(un)<0?'neg':''}">${st(un)} unités</b></div>`+
stats([['Achats',tot('achat'),'neg'],['Ventes',tot('vente'),'pos'],['Différence',tot('vente')-tot('achat')]])+
`<div class="card"><select id="a"><option value="achat">Achat d'unités</option><option value="detail">Vente au détail</option><option value="gros">Vente en gros</option></select><input id="c" type="number" inputmode="decimal" placeholder="Nombre d'unités"><input id="e" type="number" inputmode="decimal" placeholder="Prix par unité"><input id="d" type="date" value="${td()}"><button class="add" onclick="addCu()">Enregistrer</button></div>`+
L.map(x=>`<div class="card row"><div><b>${x.t=='achat'?'Achat':x.g=='gros'?'Vente gros':'Vente détail'}</b> <span class="m">× ${x.q} à ${f(x.u)}</span><div class="m">${x.d}</div></div><div class="${x.t=='achat'?'neg':'pos'}">${x.t=='achat'?'−':'+'}${f(x.q*x.u)}<button class="x" onclick="del('commerce',${x.i})">×</button></div></div>`).reverse().join('')},
acc(){const C=S.commerce.map((x,i)=>({...x,i})).filter(x=>!x.r),a=C.filter(x=>x.t=='achat'),v=C.filter(x=>x.t=='vente'),tot=l=>l.reduce((s,x)=>s+x.q*x.u,0);
const names=[...new Set(C.map(x=>x.p))],stock=names.map(n=>[n,C.filter(x=>x.p==n).reduce((s,x)=>s+(x.t=='achat'?x.q:-x.q),0)]);
return stats([['Achats',tot(a),'neg'],['Ventes',tot(v),'pos'],['Différence',tot(v)-tot(a)]])+
`<div class="card"><b>Stock</b>`+(stock.length?stock.map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b class="${q<0?'neg':''}">${q}</b></div>`).join(''):'<div class="m">Aucun produit enregistré</div>')+`</div>`+
`<div class="card"><select id="a"><option value="achat">Achat (j'achète)</option><option value="detail">Vente au détail</option><option value="gros">Vente en gros</option></select><input id="b" list="pl" placeholder="Produit (accessoire, unité...)"><datalist id="pl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><input id="c" type="number" inputmode="decimal" placeholder="Quantité"><input id="e" type="number" inputmode="decimal" placeholder="Prix unitaire"><input id="d" type="date" value="${td()}"><button class="add" onclick="addCo()">Enregistrer</button></div>`+
C.map((x,i)=>`<div class="card row"><div><b>${esc(x.p)}</b> <span class="m">× ${x.q} à ${f(x.u)}</span><div class="m">${x.d} · ${x.t=='achat'?'Achat':x.g=='gros'?'Vente gros':'Vente détail'}</div></div><div class="${x.t=='achat'?'neg':'pos'}">${x.t=='achat'?'−':'+'}${f(x.q*x.u)}<button class="x" onclick="del('commerce',${x.i})">×</button></div></div>`).reverse().join('')},
reseaux(){const bal=k=>S.reseaux.filter(x=>x.n==k).reduce((s,x)=>s+x.m*OPS[x.o][1],0);
return stats(Object.keys(RES).map(k=>[RES[k].split(' ')[0],bal(k),bal(k)<0?'neg':'']))+
`<div class="card"><select id="a">${Object.keys(RES).map(k=>`<option value="${k}">${RES[k]}</option>`).join('')}</select><select id="b">${Object.keys(OPS).map(k=>`<option value="${k}">${OPS[k][0]} (${OPS[k][1]>0?'+':'−'})</option>`).join('')}</select><input id="c" type="number" inputmode="decimal" placeholder="Montant"><input id="d" type="date" value="${td()}"><button class="add" onclick="add('reseaux',{n:val('a'),o:val('b'),m:+val('c'),d:val('d')})">Enregistrer</button></div>`+
S.reseaux.map((x,i)=>`<div class="card row"><div><b>${RES[x.n]}</b> · ${OPS[x.o][0]}<div class="m">${x.d}</div></div><div class="${OPS[x.o][1]>0?'pos':'neg'}">${OPS[x.o][1]>0?'+':'−'}${f(x.m)}<button class="x" onclick="del('reseaux',${i})">×</button></div></div>`).reverse().join('')},
histo(){const ok=e=>(hs=='all'||e.s==hs||(hs=='caisse'&&(e.s=='commerce'||e.s=='reseaux')))&&(!hf||e.d>=hf)&&(!ht||e.d<=ht),E=evts().filter(ok),i=E.filter(e=>e.g>0).reduce((s,e)=>s+e.m,0),o=E.filter(e=>e.g<0).reduce((s,e)=>s+e.m,0);
return `<div class="seg" style="overflow-x:auto">${[['all','Tout'],...Object.entries(RB)].map(([k,v])=>`<button style="white-space:nowrap;flex:none;padding:8px 12px" class="${k==hs?'on':''}" onclick="hs='${k}';render()">${v}</button>`).join('')}</div>`+
`<div class="card"><div class="row"><span class="m">Du</span><input type="date" value="${hf}" onchange="hf=this.value;render()"><span class="m">au</span><input type="date" value="${ht}" onchange="ht=this.value;render()"></div></div>`+
stats([['Entrées',i,'pos'],['Sorties',o,'neg']])+`<div class="m" style="margin:8px 2px">${E.length} opération(s)</div>`+
E.map(e=>`<div class="card row"><div><b>${esc(e.l)}</b><div class="m">${e.d} · ${RB[e.s]}</div></div><div class="${e.g>0?'pos':e.g<0?'neg':''}">${e.g>0?'+':e.g<0?'−':''}${f(e.m)}</div></div>`).join('')},
moulin(){return acct('moulin','Recharge')+''},
dettes(){return acct('dettes','Dette')},
prets(){const rest=S.prets.reduce((s,x)=>s+sch(x).reduce((a,e,j)=>a+(x.pd&&x.pd[j]?0:e.t),0),0);
return stats([['Reste à recevoir',rest]])+
`<div class="card"><input id="a" placeholder="Nom du client"><input id="b" type="number" inputmode="decimal" placeholder="Somme prêtée"><input id="c" type="number" inputmode="numeric" placeholder="Nombre de mois (ex. 6)"><input id="e" type="number" step="0.1" value="10" placeholder="Taux %"><select id="g"><option value="m">Taux 10 % par mois (sur le capital)</option><option value="t">Taux 10 % au total</option></select><input id="d" type="date" value="${td()}"><button class="add" onclick="addP()">Créer l'échéancier</button></div>`+
S.prets.map((x,i)=>{const s=sch(x);const tot=s.reduce((a,e)=>a+e.t,0);return `<div class="card"><div class="row"><b>${esc(x.n)}</b><button class="x" onclick="del('prets',${i})">×</button></div><div class="m">Prêt ${f(x.m)} · ${x.mo} mois · ${x.r}% ${x.mode=='m'?'/mois':'total'} · à rembourser ${f(tot)}</div><table><tr><th>Échéance</th><th>Capital</th><th>Intérêt</th><th>Total</th><th>Payé</th></tr>${s.map((e,j)=>`<tr><td>${e.dt}</td><td>${f(e.c)}</td><td>${f(e.i)}</td><td><b>${f(e.t)}</b></td><td><input type="checkbox" style="width:auto;margin:0" ${x.pd&&x.pd[j]?'checked':''} onchange="tg(${i},${j})"></td></tr>`).join('')}</table></div>`}).reverse().join('')}
};
function sch(x){const c=x.m/x.mo,i=x.mode=='m'?x.m*x.r/100:x.m*x.r/100/x.mo;return Array.from({length:x.mo},(_,j)=>{const d=new Date(x.d);d.setMonth(d.getMonth()+j+1);return{dt:d.toISOString().slice(0,10),c,i,t:c+i}})}
function addCu(){const o=val('a'),q=+val('c'),u=+val('e');if(!(q>0)||!(u>0)){alert('Quantité et prix requis');return}S.commerce.push({t:o=='achat'?'achat':'vente',g:o,p:'Unités '+UN[un],r:un,q,u,d:val('d')});save();render()}
function addCo(){const o=val('a'),q=+val('c'),u=+val('e');if(!val('b')||!(q>0)||!(u>0)){alert('Produit, quantité et prix requis');return}S.commerce.push({t:o=='achat'?'achat':'vente',g:o,p:val('b'),q,u,d:val('d')});save();render()}
function addP(){const m=+val('b'),mo=parseInt(val('c'));if(!val('a')||!(m>0)||!(mo>0)){alert('Nom, somme et nombre de mois requis');return}S.prets.push({n:val('a'),m,mo,r:+val('e'),mode:val('g'),d:val('d'),pd:[]});save();render()}
function tg(i,j){const x=S.prets[i];x.pd=x.pd||[];x.pd[j]=!x.pd[j];save();render()}
function acct(k,w){const mo=k=='moulin',L=S[k];
const reste=x=>x.m-sum(x.p),last=L.length-1;
const total=L.reduce((s,x)=>s+sum(x.p),0),manq=L.reduce((s,x,i)=>s+(mo&&i<last?Math.max(0,reste(x)):0),0),due=L.reduce((s,x)=>s+reste(x),0);
const st=mo?stats([['Perçu',total,'pos'],['Manquants',manq,'neg'],['Reste en cours',L.length?Math.max(0,reste(L[last])):0]]):stats([['Total dû',due,'neg'],['Remboursé',total,'pos']]);
const form=mo?`<input id="a" type="number" inputmode="decimal" placeholder="kW rechargés"><input id="b" type="number" inputmode="decimal" value="130000" placeholder="Montant attendu"><input id="d" type="date" value="${td()}"><button class="add" onclick="add('moulin',{l:val('a')+' kW',m:+val('b'),d:val('d'),p:[]})">Enregistrer la recharge</button>`
:`<input id="a" placeholder="Nom du client"><input id="e" placeholder="Ce qu'il a pris"><input id="b" type="number" inputmode="decimal" placeholder="Montant de la dette"><input id="d" type="date" value="${td()}"><button class="add" onclick="if(!val('a')){alert('Nom requis');return}add('dettes',{l:val('a'),o:val('e'),m:+val('b'),d:val('d'),p:[]})">Enregistrer la dette</button>`;
return st+`<div class="card">${form}</div>`+L.map((x,i)=>{const r=reste(x),mq=mo&&i<last&&r>0;return `<div class="card"><div class="row"><div><b>${esc(x.l)}</b> <span class="m">${x.d}${x.o?' · '+esc(x.o):''}</span></div><button class="x" onclick="del('${k}',${i})">×</button></div><div>Attendu ${f(x.m)} · Perçu ${f(sum(x.p))}</div><div><b class="${r>0?'neg':'pos'}">Reste ${f(r)}</b> ${mq?'<span class="tag">Manquant</span>':r<=0?'<span class="pos">✔ Soldé</span>':''}</div>${r>0?`<div class="r"><input id="p${k}${i}" type="number" inputmode="decimal" placeholder="Montant ${mo?'perçu':'remboursé'}"><button onclick="pay('${k}',${i})">OK</button></div>`:''}</div>`}).reverse().join('')}
function pay(k,i){const m=+$('p'+k+i).value;if(!(m>0))return;S[k][i].p.push({d:td(),m});save();render()}
function render(){$('nav').innerHTML=Object.keys(TABS).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${TABS[k]}</button>`).join('')+'<button onclick="logout()">🔒 Quitter</button>';$('main').innerHTML=V[tab]()}
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
let A;try{A=JSON.parse(localStorage.getItem('suivi_auth'))}catch(e){}
function lock(){const n=!A;$('nav').innerHTML='';$('main').innerHTML=`<div class="card"><h3 style="margin:0 0 8px">${n?'Créer votre accès':'Connexion'}</h3><input id="lu" placeholder="Identifiant" autocomplete="username"><input id="lp" type="password" placeholder="Mot de passe" autocomplete="${n?'new-password':'current-password'}">${n?'<input id="lp2" type="password" placeholder="Confirmer le mot de passe">':''}<button class="add" onclick="${n?'setup()':'login()'}">${n?'Créer et entrer':'Se connecter'}</button><div id="le" class="neg" style="margin-top:8px"></div></div>`}
const err=t=>{$('le').textContent=t};
async function setup(){const u=val('lu'),p=$('lp').value;if(!u||p.length<6)return err('Identifiant requis et mot de passe de 6 caractères minimum');if(p!==$('lp2').value)return err('Les mots de passe ne correspondent pas');const s=crypto.getRandomValues(new Uint8Array(8)).join('');A={u,s,h:await H(s+p)};try{localStorage.setItem('suivi_auth',JSON.stringify(A))}catch(e){}enter()}
async function login(){if(val('lu')!==A.u||await H(A.s+$('lp').value)!==A.h)return err('Identifiant ou mot de passe incorrect');enter()}
function enter(){try{sessionStorage.setItem('ok','1')}catch(e){}render()}
function logout(){try{sessionStorage.removeItem('ok')}catch(e){}lock()}
let ok;try{ok=sessionStorage.getItem('ok')}catch(e){}
ok&&A?render():lock();
</script></body></html>
